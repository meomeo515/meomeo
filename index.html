<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chinese Pronunciation Coach 🐾</title>
    <style>
        :root {
            /* Hệ màu xanh dương chủ đạo mới */
            --primary: #007aff;        /* Xanh dương hiện đại (Apple Blue) */
            --primary-light: #e3efff;  /* Xanh dương nhạt bổ trợ */
            --primary-dark: #0056b3;
            --dark: #1e293b;
            --light: #f8fafc;
            --success: #10b981;
            --error: #ef4444;
            /* Đổi gradient nền sang tông xanh dương pastel nhẹ nhàng */
            --bg-gradient: linear-gradient(-45deg, #e0f2fe, #dbeafe, #eff6ff, #cff0f9);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'PingFang SC', 'Helvetica Neue', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--dark);
            position: relative;
            overflow-x: hidden;
        }

        /* -------------------------------
           LỚP TRANG TRÍ ĐÀN MÈO BAY Ở NỀN
        --------------------------------- */
        .bg-cat {
            position: absolute;
            user-select: none;
            pointer-events: none;
            z-index: 0;
            opacity: 0.35;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.05));
        }
        .cat-1 { top: 8%; left: 6%; animation: floatCat1 14s ease-in-out infinite; font-size: 3.5rem; }
        .cat-2 { top: 75%; left: 10%; animation: floatCat2 18s ease-in-out infinite; font-size: 2.8rem; }
        .cat-3 { top: 12%; right: 8%; animation: floatCat3 16s ease-in-out infinite; font-size: 4rem; }
        .cat-4 { top: 68%; right: 6%; animation: floatCat1 12s ease-in-out infinite; font-size: 3rem; }
        .cat-5 { bottom: 42%; left: 3%; animation: floatCat3 15s ease-in-out infinite; font-size: 2.5rem; }
        .cat-6 { bottom: 45%; right: 4%; animation: floatCat2 13s ease-in-out infinite; font-size: 3.2rem; }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            max-width: 650px;
            width: 100%;
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(0, 122, 255, 0.12);
            padding: 35px;
            text-align: center;
            z-index: 1;
            position: relative;
            border: 1px solid rgba(255,255,255,0.6);
        }

        header h1 {
            font-size: 26px;
            color: var(--primary);
            font-weight: 800;
            margin-bottom: 5px;
        }

        header p {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 30px;
            font-weight: 500;
        }

        /* Carousel câu hỏi */
        .carousel {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--light);
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 25px;
            border: 1px solid #e2e8f0;
        }

        .nav-btn {
            background: white;
            border: 1px solid #cbd5e1;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            color: var(--primary);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
        }

        .nav-btn:hover:not(:disabled) {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            transform: scale(1.05);
        }

        .nav-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .sentence-display {
            flex: 1;
            padding: 0 15px;
        }

        .zh-text {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        .word-span {
            display: inline-block;
            margin: 0 2px;
            transition: color 0.3s;
        }
        .word-span.correct { color: var(--success); font-weight: 900; }
        .word-span.incorrect { color: var(--error); font-weight: 900; text-decoration: underline wavy var(--error) 2px; }

        .pinyin-text {
            font-size: 20px;
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .vi-text {
            font-size: 15px;
            color: #64748b;
            font-weight: 500;
        }

        /* Nút tính năng */
        .action-zone {
            margin-bottom: 25px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 50px;
            border: none;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin: 5px;
        }

        .btn-audio {
            background: var(--primary-light);
            color: var(--primary);
            border: 1px solid rgba(0, 122, 255, 0.1);
        }

        .btn-audio:hover { background: #d0e4ff; color: var(--primary-dark); }

        .btn-mic {
            background: linear-gradient(135deg, #60a5fa, #007aff);
            color: white;
            padding: 15px 40px;
            font-size: 16px;
            box-shadow: 0 10px 25px rgba(0, 122, 255, 0.25);
        }

        .btn-mic:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(0, 122, 255, 0.35);
        }

        .btn-mic.recording {
            background: #334155;
            animation: pulse 1.5s infinite;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        #statusText {
            font-size: 14px;
            color: #64748b;
            min-height: 20px;
            margin-bottom: 25px;
            font-weight: 500;
        }

        /* Bảng hiển thị kết quả */
        .result-card {
            background: var(--light);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid #e2e8f0;
            text-align: left;
            display: none;
        }

        .score-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }

        .score-title {
            font-weight: 700;
            font-size: 16px;
            color: #475569;
        }

        .score-number {
            font-size: 34px;
            font-weight: 800;
            color: var(--primary);
        }

        .metric-row {
            margin-bottom: 14px;
        }

        .metric-label {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #475569;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .progress-bar-bg {
            background: #e2e8f0;
            height: 10px;
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            border-radius: 6px;
            transition: width 0.6s cubic-bezier(0.1, 0.8, 0.3, 1);
        }

        .bg-primary-fill { background: linear-gradient(90deg, #3b82f6, #007aff); }
        .bg-success-fill { background: linear-gradient(90deg, #10b981, #00b894); }

        .transcript-box {
            margin-top: 15px;
            background: white;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            border: 1px solid #e2e8f0;
            color: #475569;
            font-weight: 500;
        }

        /* -------------------------------
           HIỆU ỨNG CHUYỂN ĐỘNG ANIMATION
        --------------------------------- */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes floatCat1 {
            0% { transform: translateY(0px) translateX(0px) rotate(0deg); }
            50% { transform: translateY(-30px) translateX(15px) rotate(12deg); }
            100% { transform: translateY(0px) translateX(0px) rotate(0deg); }
        }
        @keyframes floatCat2 {
            0% { transform: translateY(0px) translateX(0px) rotate(0deg); }
            50% { transform: translateY(20px) translateX(-15px) rotate(-8deg); }
            100% { transform: translateY(0px) translateX(0px) rotate(0deg); }
        }
        @keyframes floatCat3 {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-25px) rotate(-15deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="bg-cat cat-1">🐱</div>
<div class="bg-cat cat-2">🐈</div>
<div class="bg-cat cat-3">😸</div>
<div class="bg-cat cat-4">😹</div>
<div class="bg-cat cat-5">🐾</div>
<div class="bg-cat cat-6">🦊</div>

<div class="container">
    <header>
        <h1>AI Chinese Pronunciation Coach 🐾</h1>
        <p>Phần mềm chấm điểm phát âm tiếng Trung thông minh</p>
    </header>

    <div class="carousel">
        <button class="nav-btn" id="prevBtn" onclick="navigate(-1)" disabled>❮</button>
        <div class="sentence-display">
            <div class="zh-text" id="zhDisplay"></div>
            <div class="pinyin-text" id="pinyinDisplay"></div>
            <div class="vi-text" id="viDisplay"></div>
        </div>
        <button class="nav-btn" id="nextBtn" onclick="navigate(1)">❯</button>
    </div>

    <div class="action-zone">
        <button class="btn btn-audio" onclick="speakSample()">🔊 Nghe đọc mẫu</button>
        <br><br>
        <button class="btn btn-mic" id="micBtn" onclick="toggleListening()">🎙️ Nhấn để đọc</button>
    </div>

    <p id="statusText">Chọn một câu, nghe máy đọc mẫu sau đó nhấn nút Micro để luyện phát âm.</p>

    <div class="result-card" id="resultCard">
        <div class="score-header">
            <span class="score-title">Kết quả phân tích âm phổ</span>
            <span class="score-number" id="totalScore">0%</span>
        </div>

        <div class="metric-row">
            <div class="metric-label">
                <span>Độ chính xác từ vựng (Accuracy)</span>
                <span id="accuracyLabel">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill bg-success-fill" id="accuracyBar"></div>
            </div>
        </div>

        <div class="metric-row">
            <div class="metric-label">
                <span>Độ tự tin ngữ điệu (Confidence)</span>
                <span id="confidenceLabel">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill bg-primary-fill" id="confidenceBar"></div>
            </div>
        </div>

        <div class="transcript-box" id="transcriptBox">
            Máy nghe được: ""
        </div>
    </div>
</div>

<script>
    const chineseSentences = [
        { zh: "你好。", py: "nǐ hǎo", vi: "Xin chào.", tokens: ["你", "好"] },
        { zh: "谢谢 ny。", py: "xièxie nǐ", vi: "Cảm ơn bạn.", tokens: ["谢", "谢", "nǐ", "你"] }, // Cập nhật token bao gồm dự phòng bính âm
        { zh: "谢谢你。", py: "xièxie nǐ", vi: "Cảm ơn bạn.", tokens: ["谢", "谢", "你"] },
        { zh: "你会说汉语吗？", py: "nǐ huì shuō hànyǔ ma?", vi: "Bạn biết nói tiếng Trung không?", tokens: ["你", "会", "说", "汉", "语", "吗"] },
        { zh: "我不客气。", py: "wǒ bú kèqi", vi: "Tôi không khách sáo / Đừng khách sáo.", tokens: ["我", "不", "客", "气"] },
        { zh: "今天天气很好。", py: "jīntiān tiānqì hěn hǎo", vi: "Hôm nay thời tiết rất đẹp.", tokens: ["今", "天", "天", "气", "很", "好"] },
        { zh: "再见。", py: "zàijiàn", vi: "Tạm biệt.", tokens: ["再", "见"] }
    ];

    // Lọc bỏ trùng lặp câu bổ trợ lỗi gõ
    if(chineseSentences[1].zh === "谢谢 ny。") {
        chineseSentences.splice(1, 1);
    }

    let currentIndex = 0;
    let isListening = false;
    let recognition = null;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'zh-CN'; 
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        recognition.onresult = (event) => {
            const resultText = event.results[0][0].transcript;
            const confidence = event.results[0][0].confidence;
            evaluatePronunciation(resultText, confidence);
        };

        recognition.onerror = (event) => {
            console.error(event.error);
            stopListening();
            if (event.error === 'no-speech') {
                document.getElementById('statusText').innerText = "❌ Không phát hiện thấy giọng nói. Vui lòng thử lại!";
                resetScores();
            } else {
                document.getElementById('statusText').innerText = "❌ Lỗi Micro hoặc quyền truy cập bị từ chối.";
            }
        };

        recognition.onend = () => {
            if (isListening) stopListening();
        };
    } else {
        alert("Trình duyệt của bạn không hỗ trợ nhận diện giọng nói. Vui lòng sử dụng Google Chrome hoặc Microsoft Edge.");
    }

    function renderSentence(evaluationResult = null) {
        const sentence = chineseSentences[currentIndex];
        const zhDisplay = document.getElementById('zhDisplay');
        zhDisplay.innerHTML = '';

        sentence.tokens.forEach((char, idx) => {
            const span = document.createElement('span');
            span.className = 'word-span';
            span.innerText = char;

            if (evaluationResult) {
                if (evaluationResult.details[idx] === true) {
                    span.classList.add('correct');
                } else {
                    span.classList.add('incorrect');
                }
            }
            zhDisplay.appendChild(span);
        });

        const punc = sentence.zh.match(/[。？！，,.?]/g);
        if (punc) {
            const puncSpan = document.createElement('span');
            puncSpan.innerText = punc.join('');
            puncSpan.style.color = '#cbd5e1';
            zhDisplay.appendChild(puncSpan);
        }

        document.getElementById('pinyinDisplay').innerText = sentence.py;
        document.getElementById('viDisplay').innerText = `Ý nghĩa: ${sentence.vi}`;
    }

    function navigate(direction) {
        currentIndex += direction;
        document.getElementById('prevBtn').disabled = (currentIndex === 0);
        document.getElementById('nextBtn').disabled = (currentIndex === chineseSentences.length - 1);
        document.getElementById('resultCard').style.display = 'none';
        document.getElementById('statusText').innerText = "Đã chuyển câu. Mời bạn nghe mẫu hoặc bấm đọc luôn.";
        renderSentence();
    }

    function speakSample() {
        window.speechSynthesis.cancel();
        const sentence = chineseSentences[currentIndex].zh;
        const utterance = new SpeechSynthesisUtterance(sentence);
        utterance.lang = 'zh-CN';
        
        const voices = window.speechSynthesis.getVoices();
        const zhVoice = voices.find(v => v.lang.includes('zh-CN') || v.lang.includes('zh_CN'));
        if (zhVoice) utterance.voice = zhVoice;

        document.getElementById('statusText').innerText = "🔊 Đang phát giọng đọc mẫu...";
        window.speechSynthesis.speak(utterance);
        utterance.onend = () => {
            document.getElementById('statusText').innerText = "Mẫu đã phát xong. Hãy bấm nút Micro và đọc.";
        };
    }

    function toggleListening() {
        if (!recognition) return;
        if (isListening) {
            stopListening();
            recognition.stop();
        } else {
            startListening();
        }
    }

    function startListening() {
        isListening = true;
        const micBtn = document.getElementById('micBtn');
        micBtn.innerText = "🛑 Đang nghe... Bấm để dừng";
        micBtn.classList.add('recording');
        document.getElementById('statusText').innerText = "🎙️ Micro đang mở, hãy đọc to câu tiếng Trung ở trên...";
        document.getElementById('resultCard').style.display = 'none';
        renderSentence(); 
        recognition.start();
    }

    function stopListening() {
        isListening = false;
        const micBtn = document.getElementById('micBtn');
        micBtn.innerText = "🎙️ Nhấn để đọc";
        micBtn.className = 'btn btn-mic';
        document.getElementById('statusText').innerText = "🤖 Đang phân tích dữ liệu âm học và đối chiếu...";
    }

    function resetScores() {
        document.getElementById('resultCard').style.display = 'none';
    }

    function evaluatePronunciation(heardText, confidence) {
        const cleanHeard = heardText.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()？。，！\s]/g, "");
        const currentSentence = chineseSentences[currentIndex];
        const tokens = currentSentence.tokens;

        let matchCount = 0;
        let details = [];

        tokens.forEach((char) => {
            const charIndex = cleanHeard.indexOf(char);
            if (charIndex !== -1) {
                matchCount++;
                details.push(true); 
            } else {
                details.push(false); 
            }
        });

        let accuracyScore = Math.round((matchCount / tokens.length) * 100);
        
        if (cleanHeard.length > tokens.length) {
            const penalty = (cleanHeard.length - tokens.length) * 10;
            accuracyScore = Math.max(0, accuracyScore - penalty);
        }

        let confidenceScore = Math.round(confidence * 100);
        if (accuracyScore === 0) confidenceScore = 0; 

        let totalScore = Math.round((accuracyScore * 0.7) + (confidenceScore * 0.3));

        renderSentence({ details: details });

        document.getElementById('totalScore').innerText = totalScore + "%";
        document.getElementById('accuracyLabel').innerText = accuracyScore + "%";
        document.getElementById('confidenceLabel').innerText = confidenceScore + "%";

        document.getElementById('accuracyBar').style.width = accuracyScore + "%";
        document.getElementById('confidenceBar').style.width = confidenceScore + "%";

        document.getElementById('transcriptBox').innerText = `Hệ thống nhận diện được: "${heardText}"`;
        document.getElementById('resultCard').style.display = 'block';

        if (totalScore >= 85) {
            document.getElementById('statusText').innerText = "🎉 Tuyệt vời! Phát âm rất chuẩn xác.";
        } else if (totalScore >= 60) {
            document.getElementById('statusText').innerText = "👍 Khá tốt! Hãy luyện lại từ bị đánh dấu gạch đỏ.";
        } else {
            document.getElementById('statusText').innerText = "✍️ Điểm chưa cao. Bạn nên nghe kỹ máy đọc mẫu và thử lại nhé.";
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        renderSentence();
        if (window.speechSynthesis.onvoiceschanged !== undefined) {
            window.speechSynthesis.onvoiceschanged = () => {};
        }
    });
</script>
</body>
<H1>DiemHan</H1>
</html>
