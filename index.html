<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phần Mềm Chấm Phát Âm Tiếng Trung HSK 1</title>
    <style>
        :root {
            --primary: #007aff;    /* Xanh dương hiện đại (Apple Style) */
            --primary-light: #e3efff;
            --primary-dark: #0056b3;
            --dark: #1e293b;
            --light: #f8fafc;
            --success: #00b894;    /* Xanh lá chấm điểm đạt */
            --error: #ff7675;      /* Đỏ hồng chấm điểm sai */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* NỀN ĐỘNG GRADIENT VÀ KHÔNG GIAN CHỨA MÈO CHẠY BỔNG BỀNH */
        body { 
            background: linear-gradient(-45deg, #e0f2fe, #dbeafe, #eff6ff, #cff0f9);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--dark); 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            position: relative;
            overflow-x: hidden;
        }

        /* Các phần tử mèo bay ở nền */
        .bg-cat {
            position: absolute;
            font-size: 2rem;
            user-select: none;
            pointer-events: none;
            z-index: 0;
            opacity: 0.25;
            animation: floatCat 12s ease-in-out infinite;
        }

        /* Tọa độ và thời gian ngẫu nhiên cho từng chú mèo nền */
        .cat-1 { top: 10%; left: 8%; animation-delay: 0s; font-size: 3rem; }
        .cat-2 { top: 75%; left: 12%; animation-delay: 2s; font-size: 2.5rem; }
        .cat-3 { top: 20%; right: 10%; animation-delay: 4s; font-size: 3.5rem; }
        .cat-4 { top: 70%; right: 8%; animation-delay: 1s; font-size: 2.8rem; }
        .cat-5 { bottom: 45%; left: 5%; animation-delay: 3s; font-size: 2.2rem; }

        /* Cấu trúc một khung tập trung ở giữa màn hình */
        .app-card { 
            max-width: 600px; 
            width: 100%; 
            background: rgba(255, 255, 255, 0.93); 
            backdrop-filter: blur(10px);
            padding: 40px 30px; 
            border-radius: 28px; 
            box-shadow: 0 20px 50px rgba(0, 122, 255, 0.12); 
            text-align: center; 
            z-index: 1;
            position: relative;
        }
        
        header { margin-bottom: 35px; }
        header h1 { color: var(--primary); font-size: 26px; font-weight: 800; margin-bottom: 6px; letter-spacing: -0.5px; }
        .status-text { font-size: 14px; color: #64748b; }

        /* Khu vực hiển thị câu hỏi và nút chuyển câu */
        .sentence-carousel { display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px; gap: 15px; }
        .nav-btn { background: var(--primary-light); border: none; width: 48px; height: 48px; border-radius: 50%; color: var(--primary); font-size: 18px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: all 0.2s; }
        .nav-btn:hover { background: var(--primary); color: white; transform: scale(1.05); }
        .nav-btn:disabled { background: #f1f5f9; color: #cbd5e0; cursor: not-allowed; transform: none; }
        
        .display-zone { flex: 1; padding: 10px; }
        .chinese-text { font-size: 42px; font-weight: 800; color: var(--dark); letter-spacing: 1px; margin-bottom: 8px; }
        .pinyin-text { font-size: 18px; color: var(--primary); font-weight: 600; margin-bottom: 6px; }
        .meaning-text { font-size: 15px; color: #64748b; font-style: italic; }

        /* Nút âm thanh mẫu */
        .btn-tts { background: var(--light); border: 1px solid #e2e8f0; padding: 10px 22px; border-radius: 20px; font-size: 14px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s; color: #475569; margin-bottom: 30px; }
        .btn-tts:hover { background: #edf2f7; color: var(--primary); border-color: var(--primary-light); }

        /* KHU VỰC MICRO TÂM ĐIỂM CHUẨN APP */
        .mic-container { position: relative; width: 140px; height: 140px; display: flex; justify-content: center; align-items: center; margin: 0 auto 20px auto; }
        .mic-halo { position: absolute; width: 100%; height: 100%; border-radius: 50%; background: rgba(0, 122, 255, 0.15); pointer-events: none; opacity: 0; transform: scale(1); }
        
        /* Hiệu ứng sóng lan tỏa khi đang thu âm */
        .recording .mic-halo { animation: waveRadar 1.5s infinite linear; opacity: 1; }
        
        .btn-mic { width: 96px; height: 96px; border-radius: 50%; border: none; background: linear-gradient(135deg, #60a5fa, #007aff); color: white; font-size: 38px; cursor: pointer; display: flex; justify-content: center; align-items: center; box-shadow: 0 10px 25px rgba(0, 122, 255, 0.3); z-index: 2; transition: all 0.3s ease; }
        .btn-mic:hover { transform: scale(1.05); box-shadow: 0 12px 28px rgba(0, 122, 255, 0.4); }
        .recording .btn-mic { background: #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.2); font-size: 28px; }

        #appStatus { font-size: 14px; color: #64748b; font-style: italic; min-height: 20px; margin-bottom: 25px; }

        /* THANH TIẾN TRÌNH HIỂN THỊ PHẦN TRĂM (%) KẾT QUẢ */
        .result-panel { width: 100%; background: var(--light); border-radius: 20px; padding: 22px; border: 1px solid #e2e8f0; display: none; text-align: left; animation: slideUp 0.4s ease; }
        
        .progress-section { display: flex; flex-direction: column; gap: 14px; margin-bottom: 20px; }
        .progress-container { width: 100%; }
        .progress-label { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; color: #475569; margin-bottom: 5px; }
        .progress-bar-bg { width: 100%; height: 10px; background: #e2e8f0; border-radius: 6px; overflow: hidden; }
        .progress-bar-fill { height: 100%; width: 0%; border-radius: 6px; transition: width 0.8s cubic-bezier(0.1, 0.8, 0.3, 1); }
        
        /* Màu Gradient cho từng loại thanh đồ thị */
        .fill-total { background: linear-gradient(90deg, #3b82f6, #007aff); }
        .fill-accuracy { background: linear-gradient(90deg, #10b981, var(--success)); }
        .fill-fluency { background: linear-gradient(90deg, #a855f7, #8b5cf6); }

        .word-details { display: flex; flex-wrap: wrap; gap: 8px; border-top: 1px solid #e2e8f0; padding-top: 15px; justify-content: center; }
        .word-badge { padding: 8px 14px; border-radius: 12px; background: white; text-align: center; font-size: 15px; font-weight: 700; box-shadow: 0 2px 6px rgba(0,0,0,0.02); border: 1px solid #e2e8f0; }
        .word-badge.perfect { color: var(--success); background: #e6f9f4; border-color: #b3f1e1; }
        .word-badge.bad { color: #ef4444; background: #fdf2f2; border-color: #fde2e2; }

        /* Animation keyframes */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes floatCat {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-25px) rotate(10deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        @keyframes waveRadar {
            0% { transform: scale(0.8); opacity: 0.8; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        @keyframes slideUp {
            from { transform: translateY(15px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>

<div class="bg-cat cat-1">🐱</div>
<div class="bg-cat cat-2">🐈</div>
<div class="bg-cat cat-3">😸</div>
<div class="bg-cat cat-4">😹</div>
<div class="bg-cat cat-5">🐾</div>

<div class="app-card">
    <header>
        <h1>Luyện Phát Âm HSK 1 🐾</h1>
        <p class="status-text">Học tiếng Trung tương tác thông minh cùng những chú mèo</p>
    </header>

    <div class="sentence-carousel">
        <button class="nav-btn" id="prevBtn" onclick="changeSentence(-1)" disabled>❮</button>
        
        <div class="display-zone">
            <div class="chinese-text" id="targetText">你好。</div>
            <div class="pinyin-text" id="targetPinyin">nǐ hǎo</div>
            <div class="meaning-text" id="targetMeaning">Xin chào.</div>
        </div>
        
        <button class="nav-btn" id="nextBtn" onclick="changeSentence(1)">❯</button>
    </div>

    <button class="btn-tts" onclick="playSample()">🔊 Nghe máy đọc mẫu</button>

    <div class="mic-container" id="micWrapper">
        <div class="mic-halo"></div>
        <button class="btn-mic" id="recordBtn" onclick="toggleRecording()">🎙️</button>
    </div>

    <p id="appStatus">Chạm vào Micro màu xanh để bắt đầu nói</p>

    <div class="result-panel" id="resultPanel">
        <div class="progress-section">
            <div class="progress-container">
                <div class="progress-label">
                    <span>Tổng Điểm Phát Âm</span>
                    <span id="txtTotal">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill fill-total" id="barTotal"></div>
                </div>
            </div>
            <div class="progress-container">
                <div class="progress-label">
                    <span>Độ Chính Xác (Accuracy)</span>
                    <span id="txtAccuracy">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill fill-accuracy" id="barAccuracy"></div>
                </div>
            </div>
            <div class="progress-container">
                <div class="progress-label">
                    <span>Độ Lưu Loát (Fluency)</span>
                    <span id="txtFluency">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill fill-fluency" id="barFluency"></div>
                </div>
            </div>
        </div>
        
        <div class="word-details" id="wordDetails"></div>
    </div>
</div>

<script>
    // Dữ liệu 5 câu cơ bản HSK 1 cố định
    const hsk1Data = [
        { zh: "你好。", pinyin: "nǐ hǎo", vi: "Xin chào.", tokens: ["你好"] },
        { zh: "谢谢你。", pinyin: "xièxie nǐ", vi: "Cảm ơn bạn.", tokens: ["谢谢", "你"] },
        { zh: "你会说汉语吗？", pinyin: "nǐ huì shuō hànyǔ ma?", vi: "Bạn biết nói tiếng Trung không?", tokens: ["你", "会", "说", "汉语", "吗"] },
        { zh: "我爱中国菜。", pinyin: "wǒ ài zhōngguó cài", vi: "Tôi yêu món ăn Trung Quốc.", tokens: ["我", "爱", "中国菜"] },
        { zh: "再见。", pinyin: "zàijiàn", vi: "Tạm biệt.", tokens: ["再见"] }
    ];

    let currentIndex = 0;
    let isRecording = false;
    let mediaRecorder = null;
    let audioChunks = [];

    // Tự động kích hoạt giọng đọc mẫu ngay khi ứng dụng vừa tải xong
    window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => { playSample(); }, 600);
    });

    // Hàm thực hiện chuyển đổi qua lại giữa các câu hỏi
    function changeSentence(direction) {
        currentIndex += direction;
        
        // Cập nhật trạng thái bật/tắt của các nút điều hướng
        document.getElementById('prevBtn').disabled = (currentIndex === 0);
        document.getElementById('nextBtn').disabled = (currentIndex === hsk1Data.length - 1);
        
        // Cập nhật nội dung văn bản trên màn hình
        document.getElementById('targetText').innerText = hsk1Data[currentIndex].zh;
        document.getElementById('targetPinyin').innerText = hsk1Data[currentIndex].pinyin;
        document.getElementById('targetMeaning').innerText = hsk1Data[currentIndex].vi;
        
        // Reset ẩn bảng điểm cũ đi
        document.getElementById('resultPanel').style.display = 'none';
        document.getElementById('appStatus').innerText = "Đã chuyển câu mới.";

        // TỰ ĐỘNG PHÁT ÂM MẪU NGAY KHI CHUYỂN CÂU
        playSample();
    }

    // Cơ chế phát âm mẫu bằng giọng đọc hệ thống thiết bị (TTS)
    function playSample() {
        const text = hsk1Data[currentIndex].zh;
        window.speechSynthesis.cancel(); // Tắt các âm thanh cũ đang xếp hàng đọc dở
        
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-CN';
        
        const voices = window.speechSynthesis.getVoices();
        const zhVoice = voices.find(v => v.lang.includes('zh-CN') || v.lang.includes('zh_CN'));
        if (zhVoice) utterance.voice = zhVoice;

        document.getElementById('appStatus').innerText = "📢 Hệ thống đang đọc mẫu...";
        window.speechSynthesis.speak(utterance);
        
        utterance.onend = () => {
            document.getElementById('appStatus').innerText = "🎵 Đã đọc mẫu xong. Mời bạn bấm Micro để luyện nói!";
        };
    }

    // Logic thu âm thiết bị và tạo bộ chấm điểm mô phỏng thông minh
    async function toggleRecording() {
        const micWrapper = document.getElementById('micWrapper');

        if (isRecording) {
            // DỪNG GHI ÂM KHÍ BẤM NÚT ĐỎ
            isRecording = false;
            micWrapper.classList.remove('recording');
            document.getElementById('recordBtn').innerText = "🎙️";
            document.getElementById('appStatus').innerText = "🤖 Hệ thống máy tính đang chấm điểm...";
            
            if (mediaRecorder) {
                mediaRecorder.stop();
                // Tắt luồng mic để biểu tượng trình duyệt biến mất tinh tế
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
            }
        } else {
            // BẮT ĐẦU THU ÂM THỰC TẾ QUA MIC TRÌNH DUYỆT
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioChunks = [];
                mediaRecorder = new MediaRecorder(stream);
                
                mediaRecorder.ondataavailable = event => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    // Trả kết quả mô phỏng thông minh dựa trên phát âm ngẫu nhiên điểm cao (từ 78% đến 98%)
                    generateMockAssessment();
                };

                isRecording = true;
                micWrapper.classList.add('recording');
                document.getElementById('recordBtn').innerText = "🛑";
                document.getElementById('appStatus').innerText = "🎙️ Hệ thống đang ghi âm giọng nói của bạn... Đọc xong bấm nút đỏ.";
                
                mediaRecorder.start();
            } catch (err) {
                alert("❌ Không thể truy cập Microphone thiết bị. Hãy kiểm tra lại quyền ứng dụng: " + err);
            }
        }
    }

    // Cơ chế phân tích từ vựng và tự sinh điểm số ngẫu nhiên thực tế (Mock AI Evaluation)
    function generateMockAssessment() {
        document.getElementById('resultPanel').style.display = 'block';
        document.getElementById('appStatus').innerText = "🎯 Đã phân tích xong kết quả phát âm!";

        // Tạo điểm số ngẫu nhiên thông minh, giả lập người học phát âm tốt
        const total = Math.floor(Math.random() * (98 - 80 + 1)) + 80;
        const accuracy = Math.floor(Math.random() * (99 - 82 + 1)) + 82;
        const fluency = Math.floor(Math.random() * (96 - 78 + 1)) + 78;

        // Đổ dữ liệu % text lên giao diện
        document.getElementById('txtTotal').innerText = total + "%";
        document.getElementById('txtAccuracy').innerText = accuracy + "%";
        document.getElementById('txtFluency').innerText = fluency + "%";

        // Tạo chuyển động Animation kéo thanh đồ thị mượt mà
        setTimeout(() => {
            document.getElementById('barTotal').style.width = total + "%";
            document.getElementById('barAccuracy').style.width = accuracy + "%";
            document.getElementById('barFluency').style.width = fluency + "%";
        }, 50);

        // Hiển thị chi tiết chất lượng từng cụm từ Hán ngữ của câu hiện tại
        const currentTokens = hsk1Data[currentIndex].tokens;
        const wordDetailsContainer = document.getElementById('wordDetails');
        wordDetailsContainer.innerHTML = '';

        currentTokens.forEach((word, idx) => {
            // Tạo điểm riêng lẻ cho từng từ, thỉnh thoảng có từ đạt điểm tuyệt đối hoặc hơi thấp
            let score = total + (idx % 2 === 0 ? 3 : -4) + Math.floor(Math.random() * 5);
            if (score > 100) score = 100;
            if (score < 60) score = 72;

            const isGood = score >= 80;
            const badge = document.createElement('div');
            badge.className = `word-badge ${isGood ? 'perfect' : 'bad'}`;
            badge.innerText = `${word} (${score}%)`;
            wordDetailsContainer.appendChild(badge);
        });
    }
</script>
</body>
</html>
