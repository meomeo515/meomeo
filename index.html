<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chinese Pronunciation Assessment</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #eef2ff;
            --dark: #0f172a;
            --light: #f8fafc;
            --success: #10b981;
            --error: #ef4444;
            --bg-gradient: linear-gradient(135deg, #f0fdf4 0%, #e0f2fe 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--dark);
        }

        .container {
            background: white;
            max-width: 650px;
            width: 100%;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
            padding: 35px;
            text-align: center;
        }

        header h1 {
            font-size: 24px;
            color: var(--primary);
            margin-bottom: 5px;
        }

        header p {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 30px;
        }

        /* Carousel câu hỏi */
        .carousel {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--light);
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 25px;
            border: 1px solid #e2e8f0;
        }

        .nav-btn {
            background: white;
            border: 1px solid #cbd5e1;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            color: var(--primary);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
        }

        .nav-btn:hover:not(:disabled) {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .nav-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .sentence-display {
            flex: 1;
            padding: 0 15px;
        }

        .zh-text {
            font-size: 38px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        /* Định dạng màu sắc từng chữ sau khi chấm điểm */
        .word-span {
            display: inline-block;
            margin: 0 2px;
            transition: color 0.3s;
        }
        .word-span.correct { color: var(--success); }
        .word-span.incorrect { color: var(--error); text-decoration: underline; }

        .pinyin-text {
            font-size: 18px;
            color: #4b5563;
            font-weight: 500;
            margin-bottom: 5px;
        }

        .vi-text {
            font-size: 14px;
            color: #64748b;
            font-style: italic;
        }

        /* Nút tính năng */
        .action-zone {
            margin-bottom: 25px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 50px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin: 5px;
        }

        .btn-audio {
            background: var(--primary-light);
            color: var(--primary);
        }

        .btn-audio:hover { background: #e0e7ff; }

        .btn-mic {
            background: var(--primary);
            color: white;
            padding: 15px 35px;
            font-size: 16px;
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.2);
        }

        .btn-mic:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 22px rgba(79, 70, 229, 0.3);
        }

        .btn-mic.recording {
            background: var(--error);
            animation: pulse 1.5s infinite;
            box-shadow: 0 10px 20px rgba(239, 68, 68, 0.2);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        #statusText {
            font-size: 14px;
            color: #64748b;
            min-height: 20px;
            margin-bottom: 25px;
        }

        /* Bảng hiển thị kết quả */
        .result-card {
            background: #f8fafc;
            border-radius: 16px;
            padding: 25px;
            border: 1px solid #e2e8f0;
            text-align: left;
            display: none;
        }

        .score-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }

        .score-title {
            font-weight: 700;
            font-size: 16px;
        }

        .score-number {
            font-size: 32px;
            font-weight: 800;
            color: var(--primary);
        }

        .metric-row {
            margin-bottom: 12px;
        }

        .metric-label {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #475569;
            margin-bottom: 4px;
            font-weight: 500;
        }

        .progress-bar-bg {
            background: #e2e8f0;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            border-radius: 4px;
            transition: width 0.5s ease-out;
        }

        .bg-primary-fill { background: var(--primary); }
        .bg-success-fill { background: var(--success); }

        .transcript-box {
            margin-top: 15px;
            background: white;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            border: 1px solid #e2e8f0;
            color: #475569;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>AI Chinese Pronunciation Coach</h1>
        <p>Phần mềm chấm điểm phát âm tiếng Trung thông minh</p>
    </header>

    <!-- Khu vực hiển thị câu hỏi -->
    <div class="carousel">
        <button class="nav-btn" id="prevBtn" onclick="navigate(-1)" disabled>❮</button>
        <div class="sentence-display">
            <div class="zh-text" id="zhDisplay"></div>
            <div class="pinyin-text" id="pinyinDisplay"></div>
            <div class="vi-text" id="viDisplay"></div>
        </div>
        <button class="nav-btn" id="nextBtn" onclick="navigate(1)">❯</button>
    </div>

    <!-- Khu vực tương tác -->
    <div class="action-zone">
        <button class="btn btn-audio" onclick="speakSample()">🔊 Nghe đọc mẫu</button>
        <br><br>
        <button class="btn btn-mic" id="micBtn" onclick="toggleListening()">🎙️ Nhấn để đọc</button>
    </div>

    <p id="statusText">Chọn một câu, nghe máy đọc mẫu sau đó nhấn nút Micro để luyện phát âm.</p>

    <!-- Bảng điểm chi tiết -->
    <div class="result-card" id="resultCard">
        <div class="score-header">
            <span class="score-title">Kết quả phân tích âm phổ</span>
            <span class="score-number" id="totalScore">0%</span>
        </div>

        <div class="metric-row">
            <div class="metric-label">
                <span>Độ chính xác từ vựng (Accuracy)</span>
                <span id="accuracyLabel">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill bg-success-fill" id="accuracyBar"></div>
            </div>
        </div>

        <div class="metric-row">
            <div class="metric-label">
                <span>Độ tự tin ngữ điệu (Confidence)</span>
                <span id="confidenceLabel">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill bg-primary-fill" id="confidenceBar"></div>
            </div>
        </div>

        <div class="transcript-box" id="transcriptBox">
            Máy nghe được: ""
        </div>
    </div>
</div>

<script>
    // Danh sách các câu giao tiếp cơ bản
    const chineseSentences = [
        { zh: "你好。", py: "nǐ hǎo", vi: "Xin chào.", tokens: ["你", "好"] },
        { zh: "谢谢你。", py: "xièxie nǐ", vi: "Cảm ơn bạn.", tokens: ["谢", "谢", "你"] },
        { zh: "你会说汉语吗？", py: "nǐ huì shuō hànyǔ ma?", vi: "Bạn biết nói tiếng Trung không?", tokens: ["你", "会", "说", "汉", "语", "吗"] },
        { zh: "我不客气。", py: "wǒ bú kèqi", vi: "Tôi không khách sáo / Đừng khách sáo.", tokens: ["我", "不", "客", "气"] },
        { zh: "今天天气很好。", py: "jīntiān tiānqì hěn hǎo", vi: "Hôm nay thời tiết rất đẹp.", tokens: ["今", "天", "天", "气", "很", "好"] },
        { zh: "再见。", py: "zàijiàn", vi: "Tạm biệt.", tokens: ["再", "见"] }
    ];

    let currentIndex = 0;
    let isListening = false;
    let recognition = null;

    // Khởi tạo Speech Recognition
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'zh-CN'; // Nhận dạng tiếng Trung chuẩn (Mandarin)
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        recognition.onresult = (event) => {
            const resultText = event.results[0][0].transcript;
            const confidence = event.results[0][0].confidence;
            evaluatePronunciation(resultText, confidence);
        };

        recognition.onerror = (event) => {
            console.error(event.error);
            stopListening();
            if (event.error === 'no-speech') {
                document.getElementById('statusText').innerText = "❌ Không phát hiện thấy giọng nói. Vui lòng thử lại!";
                resetScores();
            } else {
                document.getElementById('statusText').innerText = "❌ Lỗi Micro hoặc quyền truy cập bị từ chối.";
            }
        };

        recognition.onend = () => {
            if (isListening) stopListening();
        };
    } else {
        alert("Trình duyệt của bạn không hỗ trợ nhận diện giọng nói. Vui lòng sử dụng Google Chrome hoặc Microsoft Edge.");
    }

    // Hiển thị dữ liệu câu hiện tại lên giao diện
    function renderSentence(evaluationResult = null) {
        const sentence = chineseSentences[currentIndex];
        const zhDisplay = document.getElementById('zhDisplay');
        zhDisplay.innerHTML = '';

        // Tách chữ ra để tô màu đúng sai nếu có kết quả chấm điểm
        sentence.tokens.forEach((char, idx) => {
            const span = document.createElement('span');
            span.className = 'word-span';
            span.innerText = char;

            if (evaluationResult) {
                if (evaluationResult.details[idx] === true) {
                    span.classList.add('correct');
                } else {
                    span.classList.add('incorrect');
                }
            }
            zhDisplay.appendChild(span);
        });

        // Thêm dấu câu nguyên bản
        const punc = sentence.zh.match(/[。？！，,.?]/g);
        if (punc) {
            const puncSpan = document.createElement('span');
            puncSpan.innerText = punc.join('');
            puncSpan.style.color = '#cbd5e1';
            zhDisplay.appendChild(puncSpan);
        }

        document.getElementById('pinyinDisplay').innerText = sentence.py;
        document.getElementById('viDisplay').innerText = `Ý nghĩa: ${sentence.vi}`;
    }

    // Điều hướng câu hỏi
    function navigate(direction) {
        currentIndex += direction;
        document.getElementById('prevBtn').disabled = (currentIndex === 0);
        document.getElementById('nextBtn').disabled = (currentIndex === chineseSentences.length - 1);
        document.getElementById('resultCard').style.display = 'none';
        document.getElementById('statusText').innerText = "Đã chuyển câu. Mời bạn nghe mẫu hoặc bấm đọc luôn.";
        renderSentence();
    }

    // Phát âm mẫu chuẩn (Sử dụng Text-to-Speech của hệ thống)
    function speakSample() {
        window.speechSynthesis.cancel();
        const sentence = chineseSentences[currentIndex].zh;
        const utterance = new SpeechSynthesisUtterance(sentence);
        utterance.lang = 'zh-CN';
        
        // Tìm giọng đọc tiếng Trung chất lượng cao nếu có sẵn
        const voices = window.speechSynthesis.getVoices();
        const zhVoice = voices.find(v => v.lang.includes('zh-CN') || v.lang.includes('zh_CN'));
        if (zhVoice) utterance.voice = zhVoice;

        document.getElementById('statusText').innerText = "🔊 Đang phát giọng đọc mẫu...";
        window.speechSynthesis.speak(utterance);
        utterance.onend = () => {
            document.getElementById('statusText').innerText = "Mẫu đã phát xong. Hãy bấm nút Micro và đọc.";
        };
    }

    // Điều khiển Bật/Tắt trạng thái ghi âm
    function toggleListening() {
        if (!recognition) return;
        if (isListening) {
            stopListening();
            recognition.stop();
        } else {
            startListening();
        }
    }

    function startListening() {
        isListening = true;
        const micBtn = document.getElementById('micBtn');
        micBtn.innerText = "🛑 Đang nghe... Bấm để dừng";
        micBtn.classList.add('recording');
        document.getElementById('statusText').innerText = "🎙️ Micro đang mở, hãy đọc to câu tiếng Trung ở trên...";
        document.getElementById('resultCard').style.display = 'none';
        renderSentence(); // Reset màu chữ về mặc định
        recognition.start();
    }

    function stopListening() {
        isListening = false;
        const micBtn = document.getElementById('micBtn');
        micBtn.innerText = "🎙️ Nhấn để đọc";
        micBtn.classList.add('btn-mic');
        micBtn.classList.remove('recording');
        document.getElementById('statusText').innerText = "🤖 Đang phân tích dữ liệu âm học và đối chiếu...";
    }

    function resetScores() {
        document.getElementById('resultCard').style.display = 'none';
    }

    // THUẬT TOÁN CHẤM ĐIỂM PHÁT ÂM VÀ ĐỐI CHIẾU CHUỖI
    function evaluatePronunciation(heardText, confidence) {
        // Làm sạch chuỗi máy nghe được và chuỗi mẫu (bỏ dấu câu, khoảng trắng)
        const cleanHeard = heardText.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()？。，！\s]/g, "");
        const currentSentence = chineseSentences[currentIndex];
        const tokens = currentSentence.tokens;

        let matchCount = 0;
        let details = [];

        // Kiểm tra xem từng ký tự trong câu gốc có xuất hiện trong chuỗi người dùng nói không
        tokens.forEach((char) => {
            const charIndex = cleanHeard.indexOf(char);
            if (charIndex !== -1) {
                matchCount++;
                details.push(true); // Đúng
            } else {
                details.push(false); // Sai hoặc thiếu
            }
        });

        // 1. Tính toán phần trăm độ chính xác từ vựng (Accuracy)
        let accuracyScore = Math.round((matchCount / tokens.length) * 100);
        
        // Phạt điểm nếu độ dài chuỗi nói dư thừa quá nhiều so với câu mẫu (nói lan man hoặc lẫn tạp âm)
        if (cleanHeard.length > tokens.length) {
            const penalty = (cleanHeard.length - tokens.length) * 10;
            accuracyScore = Math.max(0, accuracyScore - penalty);
        }

        // 2. Tính toán phần trăm độ tự tin/ngữ điệu (Confidence)
        let confidenceScore = Math.round(confidence * 100);
        if (accuracyScore === 0) confidenceScore = 0; // Nếu không trúng từ nào thì độ tự tin bằng 0

        // 3. Tính toán Điểm Tổng Kết (Overall Score)
        let totalScore = Math.round((accuracyScore * 0.7) + (confidenceScore * 0.3));

        // Cập nhật giao diện màu sắc trực quan cho chữ câu mẫu
        renderSentence({ details: details });

        // Hiển thị bảng điểm phần trăm
        document.getElementById('totalScore').innerText = totalScore + "%";
        document.getElementById('accuracyLabel').innerText = accuracyScore + "%";
        document.getElementById('confidenceLabel').innerText = confidenceScore + "%";

        document.getElementById('accuracyBar').style.width = accuracyScore + "%";
        document.getElementById('confidenceBar').style.width = confidenceScore + "%";

        document.getElementById('transcriptBox').innerText = `Hệ thống nhận diện được: "${heardText}"`;
        document.getElementById('resultCard').style.display = 'block';

        // Đưa ra nhận xét nhanh
        if (totalScore >= 85) {
            document.getElementById('statusText').innerText = "🎉 Tuyệt vời! Phát âm rất chuẩn xác.";
        } else if (totalScore >= 60) {
            document.getElementById('statusText').innerText = "👍 Khá tốt! Hãy luyện lại từ bị đánh dấu gạch đỏ.";
        } else {
            document.getElementById('statusText').innerText = "✍️ Điểm chưa cao. Bạn nên nghe kỹ máy đọc mẫu và thử lại nhé.";
        }
    }

    // Tự động tải câu đầu tiên khi mở trang
    window.addEventListener('DOMContentLoaded', () => {
        renderSentence();
        // Cần kích hoạt nạp danh sách giọng nói cho một số trình duyệt
        if (window.speechSynthesis.onvoiceschanged !== undefined) {
            window.speechSynthesis.onvoiceschanged = () => {};
        }
    });
</script>

</body>
</html>
