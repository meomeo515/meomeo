<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panda Speaks - Học Phát Âm Tiếng Anh</title>
    <style>
        :root {
            --panda-green: #4caf50;
            --panda-dark: #2d3748;
            --panda-light-bg: #f0fdf4;
            --card-bg: #ffffff;
            --text-main: #1a202c;
            --success-color: #22c55e;
            --error-color: #ef4444;
            --accent-yellow: #facc15;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', sans-serif;
            background-color: var(--panda-light-bg);
            /* Phông nền Panda dễ thương */
            background-image: radial-gradient(#bbf7d0 2px, transparent 2px);
            background-size: 24px 24px;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 12px;
            padding-bottom: 120px;
        }

        .app-container {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            max-width: 480px;
            width: 100%;
            text-align: center;
            border: 4px solid #bbf7d0;
            margin-top: 10px;
            position: relative;
        }

        /* Đầu gấu Panda dễ thương */
        .header-avatar {
            font-size: 4rem;
            line-height: 1;
            margin-bottom: 5px;
            animation: bounce 2s infinite;
        }

        header h1 {
            font-size: 1.5rem;
            color: #15803d;
            margin-bottom: 4px;
            font-weight: 800;
        }

        header p {
            font-size: 0.9rem;
            color: #4b5563;
            margin-bottom: 16px;
        }

        /* Khung chứa danh sách câu hỏi */
        .practice-card {
            background: #f8fafc;
            border: 2px dashed #86efac;
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 16px;
            text-align: left;
        }

        .card-title {
            font-size: 0.85rem;
            font-weight: bold;
            color: #166534;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .sentence-item {
            background: #ffffff;
            border: 2px solid #e2e8f0;
            padding: 10px 14px;
            border-radius: 14px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s;
            cursor: pointer;
        }

        .sentence-item.active {
            border-color: var(--panda-green);
            background: #f0fdf4;
            box-shadow: 0 4px 12px rgba(74, 222, 128, 0.2);
        }

        .sentence-text {
            font-size: 1.05rem;
            font-weight: bold;
            color: #1e293b;
        }

        .btn-listen {
            background: #dcfce7;
            border: 1px solid #86efac;
            color: #15803d;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: transform 0.1s;
        }

        .btn-listen:active {
            transform: scale(0.9);
            background: #bbf7d0;
        }

        /* Khung phân tích chấm điểm từng từ */
        .result-box {
            background: #ffffff;
            border: 2px solid #cbd5e1;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            text-align: center;
        }

        .result-label {
            font-size: 0.8rem;
            color: #64748b;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .word-analysis {
            font-size: 1.3rem;
            font-weight: bold;
            line-height: 1.8;
            min-height: 40px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
        }

        /* Chữ đúng màu XANH LÁ */
        .word-correct {
            color: var(--success-color);
            background: #dcfce7;
            padding: 2px 8px;
            border-radius: 8px;
            border: 1px solid #86efac;
        }

        /* Chữ sai màu ĐỎ */
        .word-incorrect {
            color: var(--error-color);
            background: #fee2e2;
            padding: 2px 8px;
            border-radius: 8px;
            border: 1px solid #fca5a5;
            text-decoration: line-through;
        }

        .status-message {
            font-size: 0.9rem;
            margin-top: 8px;
            font-weight: bold;
        }
        .status-recording { color: #d97706; animation: pulse 1s infinite; }
        .status-success { color: var(--success-color); }
        .status-error { color: var(--error-color); }

        /* Nút Micro Cố Định Dưới Màn Hình */
        .mic-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .mic-btn {
            background: linear-gradient(135deg, #22c55e, #15803d);
            color: white;
            border: 4px solid #ffffff;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            font-size: 2.2rem;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(34, 197, 94, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s ease;
        }

        .mic-btn:active {
            transform: scale(0.92);
        }

        .mic-btn.recording {
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            box-shadow: 0 8px 20px rgba(239, 68, 68, 0.5);
            animation: pulse-ring 1.2s infinite;
        }

        .mic-hint {
            font-size: 0.8rem;
            font-weight: bold;
            background: #1e293b;
            color: #ffffff;
            padding: 4px 12px;
            border-radius: 12px;
            margin-top: 8px;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 14px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header-avatar">🐼</div>
    <header>
        <h1>Panda Speaks</h1>
        <p>Bấm loa nghe trước 🔊 - Nhấn Mic đọc sau 🎙️</p>
    </header>

    <!-- Danh sách 5 câu học sinh cấp 1 -->
    <div class="practice-card">
        <div class="card-title">📌 CHỌN CÂU CẦN LUYỆN ĐỌC:</div>
        <div id="sentence-list"></div>
    </div>

    <!-- Khung hiển thị chấm lỗi phát âm từng từ -->
    <div class="result-box">
        <div class="result-label">Kết quả bé đọc:</div>
        <div id="word-analysis" class="word-analysis">👉 Hãy nhấn Micro để nói</div>
        <div id="status-message" class="status-message">Sẵn sàng!</div>
    </div>
</div>

<!-- Micro cố định ở chính giữa góc dưới -->
<div class="mic-container">
    <button id="mic-btn" class="mic-btn">🎙️</button>
    <div id="mic-hint" class="mic-hint">Bấm Mic để đọc</div>
</div>

<script>
    // 5 câu tiếng Anh đơn giản cho học sinh Cấp 1
    const sentences = [
        "He does homework.",
        "I study English.",
        "Sally answers the question.",
        "I wear my uniform.",
        "My teacher writes on the board."
    ];

    let currentSentenceIndex = 0;

    // Khởi tạo Web Speech API
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    if (!SpeechRecognition) {
        alert("Trình duyệt không hỗ trợ micro.");
    } else {
        recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;
    }

    const sentenceList = document.getElementById('sentence-list');
    const wordAnalysis = document.getElementById('word-analysis');
    const statusMessage = document.getElementById('status-message');
    const micBtn = document.getElementById('mic-btn');
    const micHint = document.getElementById('mic-hint');

    // Render danh sách câu ra màn hình
    function renderSentences() {
        sentenceList.innerHTML = '';
        sentences.forEach((text, index) => {
            const item = document.createElement('div');
            item.className = `sentence-item ${index === currentSentenceIndex ? 'active' : ''}`;
            item.onclick = () => selectSentence(index);

            item.innerHTML = `
                <span class="sentence-text">${index + 1}. ${text}</span>
                <button class="btn-listen" onclick="event.stopPropagation(); speakText('${text}')" title="Nghe đọc mẫu">
                    🔊
                </button>
            `;
            sentenceList.appendChild(item);
        });
    }

    // Chọn câu cần luyện
    function selectSentence(index) {
        currentSentenceIndex = index;
        renderSentences();
        wordAnalysis.innerText = "👉 Hãy nhấn Micro để nói";
        statusMessage.className = "status-message";
        statusMessage.innerText = "Đã chọn câu " + (index + 1);
    }

    // Máy đọc phát âm mẫu (TTS)
    function speakText(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.8; // Đọc chậm chuẩn cho học sinh
            window.speechSynthesis.speak(utterance);
        }
    }

    // Xử lý Micro thu âm
    if (recognition) {
        micBtn.addEventListener('click', () => {
            try {
                recognition.start();
            } catch (e) {
                recognition.stop();
            }
        });

        recognition.onstart = () => {
            micBtn.classList.add('recording');
            micBtn.innerText = "🛑";
            micHint.innerText = "Panda đang nghe...";
            statusMessage.className = "status-message status-recording";
            statusMessage.innerText = "Hãy đọc to rõ ràng nhé!";
        };

        recognition.onspeechend = () => {
            recognition.stop();
            resetMicUI();
        };

        recognition.onresult = (event) => {
            const spokenText = event.results[0][0].transcript;
            checkPronunciation(spokenText);
        };

        recognition.onerror = (event) => {
            resetMicUI();
            statusMessage.className = "status-message status-error";
            statusMessage.innerText = "Chưa nghe rõ,hãy bấm Mic thử lại nhé!";
        };
    }

    function resetMicUI() {
        micBtn.classList.remove('recording');
        micBtn.innerText = "🎙️";
        micHint.innerText = "Bấm Mic để đọc";
    }

    // Chấm điểm từng từ: Đúng = Xanh lá, Sai = Đỏ
    function checkPronunciation(spokenText) {
        const targetSentence = sentences[currentSentenceIndex];
        
        // Làm sạch chuỗi (xóa dấu chấm câu, chuyển thành chữ thường)
        const cleanTarget = targetSentence.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "");
        const cleanSpoken = spokenText.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "");

        const targetWords = cleanTarget.split(/\s+/);
        const spokenWords = cleanSpoken.split(/\s+/);

        let htmlResult = "";
        let correctCount = 0;

        targetWords.forEach(word => {
            if (spokenWords.includes(word)) {
                // Từ đọc ĐÚNG -> Màu xanh lá
                htmlResult += `<span class="word-correct">${word}</span>`;
                correctCount++;
            } else {
                // Từ đọc SAI hoặc thiếu -> Màu đỏ
                htmlResult += `<span class="word-incorrect">${word}</span>`;
            }
        });

        wordAnalysis.innerHTML = htmlResult;

        // Báo kết quả tổng thể
        if (correctCount === targetWords.length) {
            statusMessage.className = "status-message status-success";
            statusMessage.innerText = "🎉 Tuyệt vời! Chính xác!";
            speakText("Great job!");
        } else if (correctCount > 0) {
            statusMessage.className = "status-message status-recording";
            statusMessage.innerText = "👏 Khá lắm! Hãy luyện lại các từ màu đỏ nhé!";
        } else {
            statusMessage.className = "status-message status-error";
            statusMessage.innerText = "❌ Chưa đúng rồi. Bấm loa 🔊 nghe lại nhé!";
        }
    }

    // Tải danh sách lần đầu
    window.addEventListener('DOMContentLoaded', () => {
        renderSentences();
    });
</script>

</body>
</html>
