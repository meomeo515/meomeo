<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panda Speaks - Luyện Phát Âm Tiếng Anh</title>
    <style>
        :root {
            --panda-green: #22c55e;
            --panda-dark-green: #15803d;
            --panda-light-bg: #f0fdf4;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --success-color: #16a34a;
            --error-color: #dc2626;
            --accent-yellow: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', sans-serif;
            background-color: #e2f8eb;
            background-image: radial-gradient(#a7f3d0 2px, transparent 2px);
            background-size: 24px 24px;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            position: relative;
            overflow-x: hidden;
        }

        /* --- Trang trí Background: Đám Mây & Lá Trúc Trôi --- */
        .cloud {
            position: fixed;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 50px;
            opacity: 0.9;
            z-index: 1;
            pointer-events: none;
            animation: floatCloud linear infinite;
        }
        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 50%;
        }

        /* Thêm nhiều đám mây khác nhau */
        .cloud-1 { width: 120px; height: 40px; top: 6%; left: -140px; animation-duration: 22s; }
        .cloud-1::before { width: 50px; height: 50px; top: -20px; left: 20px; }
        .cloud-1::after { width: 40px; height: 40px; top: -15px; right: 20px; }

        .cloud-2 { width: 150px; height: 45px; top: 22%; left: -170px; animation-duration: 28s; animation-delay: 4s; }
        .cloud-2::before { width: 60px; height: 60px; top: -25px; left: 25px; }
        .cloud-2::after { width: 50px; height: 50px; top: -18px; right: 25px; }

        .cloud-3 { width: 100px; height: 35px; top: 65%; left: -120px; animation-duration: 20s; animation-delay: 9s; }
        .cloud-3::before { width: 40px; height: 40px; top: -15px; left: 15px; }
        .cloud-3::after { width: 35px; height: 35px; top: -12px; right: 15px; }

        .cloud-4 { width: 130px; height: 40px; top: 82%; left: -150px; animation-duration: 25s; animation-delay: 2s; }
        .cloud-4::before { width: 48px; height: 48px; top: -18px; left: 22px; }
        .cloud-4::after { width: 42px; height: 42px; top: -14px; right: 18px; }

        @keyframes floatCloud {
            0% { transform: translateX(-150px); }
            100% { transform: translateX(calc(100vw + 250px)); }
        }

        /* Hiệu ứng lá trúc nhỏ rơi & trôi nhẹ */
        .leaf {
            position: fixed;
            font-size: 1.4rem;
            z-index: 1;
            pointer-events: none;
            opacity: 0.7;
            animation: floatLeaf linear infinite;
        }
        .leaf-1 { top: -30px; left: 15%; animation-duration: 12s; animation-delay: 0s; }
        .leaf-2 { top: -30px; left: 45%; animation-duration: 16s; animation-delay: 3s; }
        .leaf-3 { top: -30px; left: 75%; animation-duration: 14s; animation-delay: 6s; }

        @keyframes floatLeaf {
            0% { transform: translateY(-30px) rotate(0deg) translateX(0); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(105vh) rotate(360deg) translateX(50px); opacity: 0; }
        }

        /* --- Container Chính --- */
        .app-container {
            background: var(--card-bg);
            padding: 24px 20px;
            border-radius: 28px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.1);
            max-width: 450px;
            width: 100%;
            text-align: center;
            border: 4px solid #86efac;
            position: relative;
            z-index: 10;
        }

        .progress-bar {
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--panda-dark-green);
            background: #dcfce7;
            padding: 4px 12px;
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 12px;
        }

        .header-avatar {
            font-size: 4.5rem;
            line-height: 1;
            margin-bottom: 6px;
            animation: bounce 2s infinite;
        }

        header h1 {
            font-size: 1.6rem;
            color: var(--panda-dark-green);
            margin-bottom: 4px;
            font-weight: 800;
        }

        header p {
            font-size: 0.9rem;
            color: #64748b;
            margin-bottom: 20px;
        }

        /* Khu vực Điều hướng + Khung câu hỏi */
        .card-navigation-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 16px;
        }

        .nav-btn {
            background: #ffffff;
            border: 2px solid #cbd5e1;
            color: #475569;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .nav-btn:hover:not(:disabled) {
            background: #f1f5f9;
            border-color: #94a3b8;
            color: #0f172a;
            transform: translateY(-2px);
        }

        .nav-btn:active:not(:disabled) {
            transform: scale(0.95);
        }

        .nav-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            border-color: #e2e8f0;
            background: #f8fafc;
        }

        .nav-btn.next-unlocked {
            background: #22c55e;
            color: white;
            border-color: #16a34a;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.4);
            animation: pulse-next 1.5s infinite;
        }

        @keyframes pulse-next {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .current-card {
            flex-grow: 1;
            background: #f8fafc;
            border: 2px dashed #4ade80;
            border-radius: 20px;
            padding: 18px 12px;
            position: relative;
        }

        .card-label {
            font-size: 0.75rem;
            font-weight: 800;
            color: #166534;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .target-sentence {
            font-size: 1.25rem;
            font-weight: bold;
            color: #0f172a;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .btn-listen {
            background: #dcfce7;
            border: 2px solid #86efac;
            color: var(--panda-dark-green);
            border-radius: 50px;
            padding: 6px 14px;
            font-size: 0.88rem;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-listen:active {
            transform: scale(0.95);
            background: #bbf7d0;
        }

        /* Khung kết quả & Phân tích lỗi */
        .result-box {
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .score-badge {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--panda-dark-green);
            margin-bottom: 12px;
            display: none;
        }

        .word-analysis {
            font-size: 1rem;
            font-weight: bold;
            line-height: 1.6;
            min-height: 48px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
            gap: 10px;
        }

        .word-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #f8fafc;
            padding: 6px 8px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
        }

        .word-correct {
            color: var(--success-color);
            background: #dcfce7;
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid #86efac;
            font-weight: bold;
        }

        .word-incorrect {
            color: var(--error-color);
            background: #fee2e2;
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid #fca5a5;
            font-weight: bold;
        }

        .ipa-text {
            font-size: 0.75rem;
            color: #475569;
            font-family: Arial, sans-serif;
            margin-top: 2px;
        }

        .error-detail {
            font-size: 0.7rem;
            color: #dc2626;
            font-weight: normal;
            margin-top: 2px;
            text-align: center;
        }

        .status-message {
            font-size: 0.9rem;
            margin-top: 12px;
            font-weight: bold;
            min-height: 24px;
        }
        .status-recording { color: #d97706; animation: pulse 1s infinite; }
        .status-success { color: var(--success-color); }
        .status-error { color: var(--error-color); }

        /* Nút Micro Thu Âm */
        .mic-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .mic-btn {
            background: linear-gradient(135deg, #22c55e, #15803d);
            color: white;
            border: 4px solid #ffffff;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            font-size: 2.2rem;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(34, 197, 94, 0.35);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s ease;
        }

        .mic-btn:active {
            transform: scale(0.92);
        }

        .mic-btn.recording {
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            box-shadow: 0 8px 20px rgba(239, 68, 68, 0.45);
            animation: pulse-ring 1.2s infinite;
        }

        .mic-hint {
            font-size: 0.8rem;
            font-weight: bold;
            background: #1e293b;
            color: #ffffff;
            padding: 4px 12px;
            border-radius: 12px;
            margin-top: 8px;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 14px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body>

<!-- Trang trí Đám Mây Mới -->
<div class="cloud cloud-1"></div>
<div class="cloud cloud-2"></div>
<div class="cloud cloud-3"></div>
<div class="cloud cloud-4"></div>

<!-- Trang trí Lá Trúc Nhỏ Rơi -->
<div class="leaf leaf-1">🍃</div>
<div class="leaf leaf-2">🍃</div>
<div class="leaf leaf-3">🍃</div>

<div class="app-container">
    <div id="progress-bar" class="progress-bar">Câu 1 / 5</div>
    <div class="header-avatar">🐼</div>
    <header>
        <h1>Panda Speaks</h1>
        <p>Nghe mẫu 🔊 rồi bấm Mic đọc nhé!</p>
    </header>

    <!-- Khung hiển thị câu + Nút Back & Next -->
    <div class="card-navigation-wrapper">
        <button id="prev-btn" class="nav-btn" onclick="prevSentence()" title="Câu trước">❮</button>
        
        <div class="current-card">
            <div class="card-label">Câu cần luyện đọc:</div>
            <div id="target-sentence" class="target-sentence">Loading...</div>
            <button class="btn-listen" onclick="speakText(sentences[currentIndex])">
                🔊 Nghe đọc mẫu
            </button>
        </div>

        <button id="next-btn" class="nav-btn" onclick="nextSentence()" title="Câu tiếp theo" disabled>❯</button>
    </div>

    <!-- Khung Phân Tích & Chấm Điểm -->
    <div class="result-box">
        <div id="score-badge" class="score-badge">Độ chính xác: 0%</div>
        <div id="word-analysis" class="word-analysis">👉 Bấm Micro để bắt đầu nói</div>
        <div id="status-message" class="status-message">Sẵn sàng!</div>
    </div>

    <!-- Nút Micro Thu Âm -->
    <div class="mic-container">
        <button id="mic-btn" class="mic-btn">🎙️</button>
        <div id="mic-hint" class="mic-hint">Bấm Mic để đọc</div>
    </div>
</div>

<script>
    // Danh sách câu và từ điển phiên âm IPA cơ bản
    const sentences = [
        "He does homework.",
        "I study English.",
        "Sally answers the question.",
        "I wear my uniform.",
        "My teacher writes on the board."
    ];

    const dictionaryIPA = {
        "he": "/hiː/",
        "does": "/dʌz/",
        "homework": "/ˈhoʊm.wɝːk/",
        "i": "/aɪ/",
        "study": "/ˈstʌd.i/",
        "english": "/ˈɪŋ.ɡlɪʃ/",
        "sally": "/ˈsæl.i/",
        "answers": "/ˈæn.sɚz/",
        "the": "/ðə/",
        "question": "/ˈkwes.tʃən/",
        "wear": "/wer/",
        "my": "/maɪ/",
        "uniform": "/ˈjuː.nə.fɔːrm/",
        "teacher": "/ˈtiː.tʃɚ/",
        "writes": "/raɪts/",
        "on": "/ɑːn/",
        "board": "/bɔːrd/"
    };

    let currentIndex = 0;
    let isCurrentPassed = false;

    // Web Speech API
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    if (!SpeechRecognition) {
        alert("Trình duyệt không hỗ trợ nhận diện giọng nói. Hãy dùng Google Chrome hoặc Safari.");
    } else {
        recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;
    }

    const targetSentenceEl = document.getElementById('target-sentence');
    const progressBarEl = document.getElementById('progress-bar');
    const wordAnalysisEl = document.getElementById('word-analysis');
    const scoreBadgeEl = document.getElementById('score-badge');
    const statusMessageEl = document.getElementById('status-message');
    const micBtn = document.getElementById('mic-btn');
    const micHint = document.getElementById('mic-hint');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');

    // Hiển thị câu hiện tại
    function loadSentence() {
        targetSentenceEl.innerText = sentences[currentIndex];
        progressBarEl.innerText = `Câu ${currentIndex + 1} / ${sentences.length}`;
        wordAnalysisEl.innerHTML = "👉 Bấm Micro để bắt đầu nói";
        scoreBadgeEl.style.display = "none";
        statusMessageEl.className = "status-message";
        statusMessageEl.innerText = "Sẵn sàng!";
        
        isCurrentPassed = false;
        updateNavButtons();
    }

    // Cập nhật trạng thái nút Prev / Next
    function updateNavButtons() {
        prevBtn.disabled = (currentIndex === 0);
        
        // Điều kiện để có nút Next: Đã đọc đạt >= 60% HOẶC là câu cuối cùng
        if (isCurrentPassed) {
            nextBtn.disabled = (currentIndex === sentences.length - 1);
            if (currentIndex < sentences.length - 1) {
                nextBtn.classList.add('next-unlocked');
            } else {
                nextBtn.classList.remove('next-unlocked');
            }
        } else {
            nextBtn.disabled = true;
            nextBtn.classList.remove('next-unlocked');
        }
    }

    function prevSentence() {
        if (currentIndex > 0) {
            currentIndex--;
            loadSentence();
        }
    }

    function nextSentence() {
        if (currentIndex < sentences.length - 1 && isCurrentPassed) {
            currentIndex++;
            loadSentence();
        }
    }

    // Đọc mẫu (TTS)
    function speakText(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.8;
            window.speechSynthesis.speak(utterance);
        }
    }

    // Tiếng hiệu ứng (Web Audio API)
    function playSound(type) {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);

            if (type === 'success') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.12);
                osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.24);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.5);
            } else {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(220, ctx.currentTime);
                osc.frequency.setValueAtTime(180, ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.4);
            }
        } catch(e) {}
    }

    // Xử lý Sự kiện Micro
    if (recognition) {
        micBtn.addEventListener('click', () => {
            try {
                recognition.start();
            } catch (e) {
                recognition.stop();
            }
        });

        recognition.onstart = () => {
            micBtn.classList.add('recording');
            micBtn.innerText = "🛑";
            micHint.innerText = "Panda đang nghe...";
            statusMessageEl.className = "status-message status-recording";
            statusMessageEl.innerText = "Hãy đọc to rõ ràng nhé!";
        };

        recognition.onspeechend = () => {
            recognition.stop();
            resetMicUI();
        };

        recognition.onresult = (event) => {
            const spokenText = event.results[0][0].transcript;
            analyzeSpeechHighAccuracy(spokenText);
        };

        recognition.onerror = () => {
            resetMicUI();
            statusMessageEl.className = "status-message status-error";
            statusMessageEl.innerText = "Chưa nghe rõ, bấm Mic thử lại nhé!";
        };
    }

    function resetMicUI() {
        micBtn.classList.remove('recording');
        micBtn.innerText = "🎙️";
        micHint.innerText = "Bấm Mic để đọc";
    }

    // Thuật toán Levenshtein Distance đo độ tương đồng chuỗi
    function getSimilarity(a, b) {
        if (!a || !b) return 0;
        const matrix = [];
        for (let i = 0; i <= b.length; i++) matrix[i] = [i];
        for (let j = 0; j <= a.length; j++) matrix[0][j] = j;

        for (let i = 1; i <= b.length; i++) {
            for (let j = 1; j <= a.length; j++) {
                if (b.charAt(i - 1) === a.charAt(j - 1)) {
                    matrix[i][j] = matrix[i - 1][j - 1];
                } else {
                    matrix[i][j] = Math.min(
                        matrix[i - 1][j - 1] + 1,
                        matrix[i][j - 1] + 1,
                        matrix[i - 1][j] + 1
                    );
                }
            }
        }
        const maxLen = Math.max(a.length, b.length);
        return ((maxLen - matrix[b.length][a.length]) / maxLen);
    }

    // Phân tích chi tiết vị trí lỗi phát âm
    function diagnosePhoneticError(targetWord, spokenWord) {
        if (!spokenWord) return "Thiếu từ";
        
        // Kiểm tra lỗi âm đầu / âm cuối / âm giữa
        if (targetWord[0] !== spokenWord[0]) {
            return `Sai âm đầu (${spokenWord[0]}→${targetWord[0]})`;
        }
        if (targetWord[targetWord.length - 1] !== spokenWord[spokenWord.length - 1]) {
            return `Sai âm cuối (-${targetWord[targetWord.length - 1]})`;
        }
        return `Nghe thành "${spokenWord}"`;
    }

    // Chấm điểm & Phân tích lỗi chính xác hơn
    function analyzeSpeechHighAccuracy(spokenText) {
        const targetSentence = sentences[currentIndex];
        
        const cleanTarget = targetSentence.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "");
        const cleanSpoken = spokenText.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "");

        const targetWords = cleanTarget.split(/\s+/);
        const spokenWords = cleanSpoken.split(/\s+/);

        let totalSimilarity = 0;
        let htmlResult = "";

        targetWords.forEach((targetWord, index) => {
            let bestMatchWord = "";
            let bestSimilarity = 0;

            // Ưu tiên so sánh các từ ở gần vị trí chỉ số tương ứng
            spokenWords.forEach((spokenWord, sIdx) => {
                const sim = getSimilarity(targetWord, spokenWord);
                const distancePenalty = Math.abs(index - sIdx) * 0.05; // Phạt nếu vị trí từ lệch quá xa
                const adjustedSim = Math.max(0, sim - distancePenalty);

                if (adjustedSim > bestSimilarity) {
                    bestSimilarity = sim;
                    bestMatchWord = spokenWord;
                }
            });

            totalSimilarity += bestSimilarity;
            const ipa = dictionaryIPA[targetWord] || "";

            if (bestSimilarity >= 0.80) {
                // Đọc đúng
                htmlResult += `
                    <div class="word-item">
                        <span class="word-correct">${targetWord}</span>
                        <span class="ipa-text">${ipa}</span>
                    </div>`;
            } else {
                // Đọc sai - Hiển thị phân tích vị trí lỗi
                const errorMsg = diagnosePhoneticError(targetWord, bestMatchWord);
                htmlResult += `
                    <div class="word-item">
                        <span class="word-incorrect">${targetWord}</span>
                        <span class="ipa-text">${ipa}</span>
                        <span class="error-detail">${errorMsg}</span>
                    </div>`;
            }
        });

        // Tính % chính xác tổng thể
        const finalPercentage = Math.round((totalSimilarity / targetWords.length) * 100);

        scoreBadgeEl.innerText = `Độ chính xác: ${finalPercentage}%`;
        scoreBadgeEl.style.display = "block";
        wordAnalysisEl.innerHTML = htmlResult;

        // Xử lý mở khóa Nút Next nếu đạt >= 60%
        if (finalPercentage >= 60) {
            playSound('success');
            isCurrentPassed = true;
            statusMessageEl.className = "status-message status-success";
            
            if (currentIndex < sentences.length - 1) {
                statusMessageEl.innerText = "🎉 Tuyệt vời! Hãy bấm nút '❯' để sang câu tiếp theo.";
            } else {
                statusMessageEl.innerText = "🏆 Hoàn thành xuất sắc toàn bộ bài học!";
            }
        } else {
            playSound('error');
            isCurrentPassed = false;
            statusMessageEl.className = "status-message status-error";
            statusMessageEl.innerText = "👏 Cần đạt trên 60% để sang câu tiếp. Hãy nghe lại rồi đọc nhé!";
        }

        updateNavButtons();
    }

    // Khởi chạy ứng dụng
    window.addEventListener('DOMContentLoaded', () => {
        loadSentence();
    });
</script>

</body>
</html>
