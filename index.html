<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panda Speaks - Luyện Phát Âm Tiếng Anh</title>
    <style>
        :root {
            --panda-green: #22c55e;
            --panda-dark-green: #15803d;
            --panda-light-bg: #f0fdf4;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --success-color: #16a34a;
            --error-color: #dc2626;
            --accent-yellow: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', sans-serif;
            background-color: #e2f8eb;
            background-image: radial-gradient(#a7f3d0 2px, transparent 2px);
            background-size: 24px 24px;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            position: relative;
            overflow-x: hidden;
        }

        /* --- Background Decoration --- */
        .cloud {
            position: fixed;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 50px;
            opacity: 0.9;
            z-index: 1;
            pointer-events: none;
            animation: floatCloud linear infinite;
        }
        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 50%;
        }

        .cloud-1 { width: 120px; height: 40px; top: 6%; left: -140px; animation-duration: 22s; }
        .cloud-1::before { width: 50px; height: 50px; top: -20px; left: 20px; }
        .cloud-1::after { width: 40px; height: 40px; top: -15px; right: 20px; }

        .cloud-2 { width: 150px; height: 45px; top: 22%; left: -170px; animation-duration: 28s; animation-delay: 4s; }
        .cloud-2::before { width: 60px; height: 60px; top: -25px; left: 25px; }
        .cloud-2::after { width: 50px; height: 50px; top: -18px; right: 25px; }

        .cloud-3 { width: 100px; height: 35px; top: 65%; left: -120px; animation-duration: 20s; animation-delay: 9s; }
        .cloud-3::before { width: 40px; height: 40px; top: -15px; left: 15px; }
        .cloud-3::after { width: 35px; height: 35px; top: -12px; right: 15px; }

        .cloud-4 { width: 130px; height: 40px; top: 82%; left: -150px; animation-duration: 25s; animation-delay: 2s; }
        .cloud-4::before { width: 48px; height: 48px; top: -18px; left: 22px; }
        .cloud-4::after { width: 42px; height: 42px; top: -14px; right: 18px; }

        @keyframes floatCloud {
            0% { transform: translateX(-150px); }
            100% { transform: translateX(calc(100vw + 250px)); }
        }

        /* --- Main Container --- */
        .app-container {
            background: var(--card-bg);
            padding: 24px 20px;
            border-radius: 28px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.1);
            max-width: 480px;
            width: 100%;
            text-align: center;
            border: 4px solid #86efac;
            position: relative;
            z-index: 10;
        }

        .progress-bar {
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--panda-dark-green);
            background: #dcfce7;
            padding: 4px 12px;
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 12px;
        }

        .header-avatar {
            font-size: 4.5rem;
            line-height: 1;
            margin-bottom: 6px;
            animation: bounce 2s infinite;
        }

        header h1 {
            font-size: 1.6rem;
            color: var(--panda-dark-green);
            margin-bottom: 4px;
            font-weight: 800;
        }

        header p {
            font-size: 0.9rem;
            color: #64748b;
            margin-bottom: 20px;
        }

        .card-navigation-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 16px;
        }

        .nav-btn {
            background: #ffffff;
            border: 2px solid #cbd5e1;
            color: #475569;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .nav-btn:hover:not(:disabled) {
            background: #f1f5f9;
            border-color: #94a3b8;
            color: #0f172a;
            transform: translateY(-2px);
        }

        .nav-btn:active:not(:disabled) {
            transform: scale(0.95);
        }

        .nav-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            border-color: #e2e8f0;
            background: #f8fafc;
        }

        .nav-btn.next-unlocked {
            background: #22c55e;
            color: white;
            border-color: #16a34a;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.4);
            animation: pulse-next 1.5s infinite;
        }

        @keyframes pulse-next {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .current-card {
            flex-grow: 1;
            background: #f8fafc;
            border: 2px dashed #4ade80;
            border-radius: 20px;
            padding: 18px 12px;
            position: relative;
        }

        .card-label {
            font-size: 0.75rem;
            font-weight: 800;
            color: #166534;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .target-sentence {
            font-size: 1.2rem;
            font-weight: bold;
            color: #0f172a;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .btn-listen {
            background: #dcfce7;
            border: 2px solid #86efac;
            color: var(--panda-dark-green);
            border-radius: 50px;
            padding: 6px 14px;
            font-size: 0.88rem;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-listen:active {
            transform: scale(0.95);
            background: #bbf7d0;
        }

        .result-box {
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .score-badge {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--panda-dark-green);
            margin-bottom: 12px;
            display: none;
        }

        .word-analysis {
            font-size: 1rem;
            font-weight: bold;
            line-height: 1.6;
            min-height: 48px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
            gap: 8px;
        }

        .word-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #f8fafc;
            padding: 6px 8px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        .word-item:hover {
            transform: translateY(-2px);
        }

        .word-correct {
            color: var(--success-color);
            background: #dcfce7;
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid #86efac;
            font-weight: bold;
        }

        .word-incorrect {
            color: var(--error-color);
            background: #fee2e2;
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid #fca5a5;
            font-weight: bold;
        }

        .ipa-text {
            font-size: 0.75rem;
            color: #475569;
            font-family: Arial, sans-serif;
            margin-top: 2px;
        }

        .status-message {
            font-size: 0.9rem;
            margin-top: 12px;
            font-weight: bold;
            min-height: 24px;
        }
        .status-recording { color: #d97706; animation: pulse 1s infinite; }
        .status-success { color: var(--success-color); }
        .status-error { color: var(--error-color); }

        .mic-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .mic-btn {
            background: linear-gradient(135deg, #22c55e, #15803d);
            color: white;
            border: 4px solid #ffffff;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            font-size: 2.2rem;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(34, 197, 94, 0.35);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s ease;
        }

        .mic-btn:active {
            transform: scale(0.92);
        }

        .mic-btn.recording {
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            box-shadow: 0 8px 20px rgba(239, 68, 68, 0.45);
            animation: pulse-ring 1.2s infinite;
        }

        .mic-hint {
            font-size: 0.8rem;
            font-weight: bold;
            background: #1e293b;
            color: #ffffff;
            padding: 4px 12px;
            border-radius: 12px;
            margin-top: 8px;
        }

        /* --- Reward Overlay (Cây trúc & Panda) --- */
        .reward-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 28px;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
            animation: fadeIn 0.5s ease-out;
        }

        .reward-overlay.active {
            display: flex;
        }

        .reward-bamboo-container {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 15px;
            margin: 15px 0;
        }

        .bamboo-stalk {
            font-size: 3.5rem;
            animation: growBamboo 0.8s ease-out forwards;
            transform-origin: bottom;
        }

        .panda-reward {
            font-size: 5rem;
            animation: pandaEat 1s ease-in-out infinite alternate;
        }

        .reward-title {
            font-size: 1.8rem;
            color: var(--panda-dark-green);
            font-weight: bold;
            margin-bottom: 8px;
        }

        .reward-subtitle {
            font-size: 1rem;
            color: #475569;
            margin-bottom: 20px;
        }

        .btn-restart {
            background: #22c55e;
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
            transition: transform 0.2s;
        }

        .btn-restart:active {
            transform: scale(0.95);
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 14px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        @keyframes growBamboo {
            0% { transform: scaleY(0); }
            100% { transform: scaleY(1); }
        }

        @keyframes pandaEat {
            0% { transform: rotate(-5deg); }
            100% { transform: rotate(5deg) scale(1.05); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="cloud cloud-1"></div>
<div class="cloud cloud-2"></div>
<div class="cloud cloud-3"></div>
<div class="cloud cloud-4"></div>

<div class="app-container">
    <div id="progress-bar" class="progress-bar">Câu 1 / 5</div>
    <div class="header-avatar">🐼</div>
    <header>
        <h1>Panda Speaks</h1>
        <p>Nghe mẫu 🔊 rồi bấm Mic đọc nhé!</p>
    </header>

    <div class="card-navigation-wrapper">
        <button id="prev-btn" class="nav-btn" onclick="prevSentence()" title="Câu trước">❮</button>
        
        <div class="current-card">
            <div class="card-label">Câu cần luyện đọc:</div>
            <div id="target-sentence" class="target-sentence">Loading...</div>
            <button class="btn-listen" onclick="speakText(sentences[currentIndex])">
                🔊 Nghe đọc mẫu
            </button>
        </div>

        <button id="next-btn" class="nav-btn" onclick="nextSentence()" title="Câu tiếp theo" disabled>❯</button>
    </div>

    <div class="result-box">
        <div id="score-badge" class="score-badge">Độ chính xác: 0%</div>
        <div id="word-analysis" class="word-analysis">👉 Bấm Micro để bắt đầu nói</div>
        <div id="status-message" class="status-message">Sẵn sàng!</div>
    </div>

    <div class="mic-container">
        <button id="mic-btn" class="mic-btn">🎙️</button>
        <div id="mic-hint" class="mic-hint">Bấm Mic để đọc</div>
    </div>

    <!-- Màn hình thưởng hoàn thành -->
    <div id="reward-overlay" class="reward-overlay">
        <div class="reward-title">🎉 HOÀN THÀNH XUẤT SẮC!</div>
        <div class="reward-subtitle">Bạn đã tặng Panda một rừng trúc xanh mướt!</div>
        <div class="reward-bamboo-container">
            <span class="bamboo-stalk">🎋</span>
            <span class="panda-reward">🐼</span>
            <span class="bamboo-stalk">🎋</span>
        </div>
        <button class="btn-restart" onclick="restartApp()">Luyện lại từ đầu 🔄</button>
    </div>
</div>

<script>
    const sentences = [
        "He does homework.",
        "I study English every single day.",
        "Sally answers the question carefully.",
        "I wear my uniform when I go to school.",
        "My teacher writes on the board with green chalk."
    ];

    const dictionaryIPA = {
        "he": "hiː",
        "does": "dʌz",
        "homework": "hoʊm.wɝːk",
        "i": "aɪ",
        "study": "stʌd.i",
        "english": "ɪŋ.ɡlɪʃ",
        "every": "ev.ri",
        "single": "sɪŋ.ɡəl",
        "day": "deɪ",
        "sally": "sæl.i",
        "answers": "æn.sɚz",
        "the": "ðə",
        "question": "kwes.tʃən",
        "carefully": "ker.fəl.i",
        "wear": "wer",
        "my": "maɪ",
        "uniform": "juː.nə.fɔːrm",
        "when": "wen",
        "go": "ɡoʊ",
        "to": "tuː",
        "school": "skuːl",
        "teacher": "tiː.tʃɚ",
        "writes": "raɪts",
        "on": "ɑːn",
        "board": "bɔːrd",
        "with": "wɪð",
        "green": "ɡriːn",
        "chalk": "tʃɑːk"
    };

    let currentIndex = 0;
    let isCurrentPassed = false;
    let isRecording = false;
    let recordingTimeout = null;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    if (!SpeechRecognition) {
        alert("Trình duyệt không hỗ trợ nhận diện giọng nói. Hãy dùng Google Chrome hoặc Safari.");
    } else {
        recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;
        recognition.continuous = true;
    }

    const targetSentenceEl = document.getElementById('target-sentence');
    const progressBarEl = document.getElementById('progress-bar');
    const wordAnalysisEl = document.getElementById('word-analysis');
    const scoreBadgeEl = document.getElementById('score-badge');
    const statusMessageEl = document.getElementById('status-message');
    const micBtn = document.getElementById('mic-btn');
    const micHint = document.getElementById('mic-hint');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const rewardOverlay = document.getElementById('reward-overlay');

    function loadSentence() {
        targetSentenceEl.innerText = sentences[currentIndex];
        progressBarEl.innerText = `Câu ${currentIndex + 1} / ${sentences.length}`;
        wordAnalysisEl.innerHTML = "👉 Bấm Micro để bắt đầu nói";
        scoreBadgeEl.style.display = "none";
        statusMessageEl.className = "status-message";
        statusMessageEl.innerText = "Sẵn sàng!";
        
        isCurrentPassed = false;
        updateNavButtons();
    }

    function updateNavButtons() {
        prevBtn.disabled = (currentIndex === 0);
        
        if (isCurrentPassed) {
            nextBtn.disabled = false;
            nextBtn.classList.add('next-unlocked');
        } else {
            nextBtn.disabled = true;
            nextBtn.classList.remove('next-unlocked');
        }
    }

    function prevSentence() {
        if (currentIndex > 0) {
            stopRecordingProcess();
            currentIndex--;
            loadSentence();
        }
    }

    function nextSentence() {
        if (currentIndex < sentences.length - 1) {
            if (isCurrentPassed) {
                stopRecordingProcess();
                currentIndex++;
                loadSentence();
            }
        } else if (isCurrentPassed) {
            showRewardScreen();
        }
    }

    function speakText(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.8;
            window.speechSynthesis.speak(utterance);
        }
    }

    function playSound(type) {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);

            if (type === 'success') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.12);
                osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.24);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.5);
            } else if (type === 'fanfare') {
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const noteOsc = ctx.createOscillator();
                    const noteGain = ctx.createGain();
                    noteOsc.connect(noteGain);
                    noteGain.connect(ctx.destination);
                    noteOsc.type = 'triangle';
                    noteOsc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.15);
                    noteGain.gain.setValueAtTime(0.3, ctx.currentTime + idx * 0.15);
                    noteGain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.15 + 0.4);
                    noteOsc.start(ctx.currentTime + idx * 0.15);
                    noteOsc.stop(ctx.currentTime + idx * 0.15 + 0.4);
                });
            } else {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(220, ctx.currentTime);
                osc.frequency.setValueAtTime(180, ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.4);
            }
        } catch(e) {}
    }

    if (recognition) {
        micBtn.addEventListener('click', () => {
            if (isRecording) {
                stopRecordingProcess();
            } else {
                startRecordingProcess();
            }
        });

        recognition.onstart = () => {
            isRecording = true;
            micBtn.classList.add('recording');
            micBtn.innerText = "🛑";
            micHint.innerText = "Đang nghe... Bấm 🛑 khi hoàn thành";
            statusMessageEl.className = "status-message status-recording";
            statusMessageEl.innerText = "Panda đang lắng nghe, bạn cứ thoải mái đọc nhé!";

            const wordCount = sentences[currentIndex].split(' ').length;
            const dynamicTimeout = Math.max(8000, wordCount * 1500); // Tăng thời gian chờ đọc cho câu dài

            if (recordingTimeout) clearTimeout(recordingTimeout);
            recordingTimeout = setTimeout(() => {
                if (isRecording) {
                    stopRecordingProcess();
                }
            }, dynamicTimeout);
        };

        recognition.onresult = (event) => {
            let spokenText = "";
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                spokenText += event.results[i][0].transcript + " ";
            }
            stopRecordingProcess();
            analyzeIPASpeech(spokenText.trim());
        };

        recognition.onerror = () => {
            stopRecordingProcess();
            statusMessageEl.className = "status-message status-error";
            statusMessageEl.innerText = "Chưa nghe rõ, bấm Mic thử đọc lại nhé!";
        };

        recognition.onend = () => {
            if (isRecording) {
                stopRecordingProcess();
            }
        };
    }

    function startRecordingProcess() {
        try {
            recognition.start();
        } catch (e) {
            stopRecordingProcess();
        }
    }

    function stopRecordingProcess() {
        isRecording = false;
        if (recordingTimeout) clearTimeout(recordingTimeout);
        try { recognition.stop(); } catch(e){}
        resetMicUI();
    }

    function resetMicUI() {
        micBtn.classList.remove('recording');
        micBtn.innerText = "🎙️";
        micHint.innerText = "Bấm Mic để đọc";
    }

    function getLevenshteinDistance(a, b) {
        if (!a || !b) return Math.max(a ? a.length : 0, b ? b.length : 0);
        const matrix = [];
        for (let i = 0; i <= b.length; i++) matrix[i] = [i];
        for (let j = 0; j <= a.length; j++) matrix[0][j] = j;

        for (let i = 1; i <= b.length; i++) {
            for (let j = 1; j <= a.length; j++) {
                if (b.charAt(i - 1) === a.charAt(j - 1)) {
                    matrix[i][j] = matrix[i - 1][j - 1];
                } else {
                    matrix[i][j] = Math.min(
                        matrix[i - 1][j - 1] + 1,
                        matrix[i][j - 1] + 1,
                        matrix[i - 1][j] + 1
                    );
                }
            }
        }
        return matrix[b.length][a.length];
    }

    // Algorithmic Pronunciation Matcher (Đã tối ưu chấm dễ hơn cho câu dài)
    function analyzeIPASpeech(spokenText) {
        const targetSentence = sentences[currentIndex];
        
        const cleanTarget = targetSentence.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "");
        const cleanSpoken = spokenText.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "");

        const targetWords = cleanTarget.split(/\s+/).filter(Boolean);
        const spokenWords = cleanSpoken.split(/\s+/).filter(Boolean);

        let totalScore = 0;
        let htmlResult = "";
        let spokenPointer = 0;

        // Cấu hình linh hoạt theo độ dài câu
        const isLongSentence = targetWords.length >= 4;
        const wordMatchThreshold = isLongSentence ? 0.35 : 0.45; // Ngưỡng nhận diện từng từ cực dễ
        const searchWindow = isLongSentence ? 6 : 4; // Cửa sổ quét rộng hơn cho câu dài

        targetWords.forEach((targetWord) => {
            const targetIPA = dictionaryIPA[targetWord] || targetWord;
            let bestWordScore = 0;
            let bestMatchIndex = -1;

            for (let sIdx = spokenPointer; sIdx < Math.min(spokenPointer + searchWindow, spokenWords.length); sIdx++) {
                const spokenWord = spokenWords[sIdx];
                let currentWordScore = 0;

                if (targetWord === spokenWord) {
                    currentWordScore = 1.0;
                } else {
                    const textDist = getLevenshteinDistance(targetWord, spokenWord);
                    const maxTextLen = Math.max(targetWord.length, spokenWord.length);
                    const textSim = (maxTextLen - textDist) / maxTextLen;

                    const spokenIPA = dictionaryIPA[spokenWord] || spokenWord;
                    const cleanTargetIPA = targetIPA.replace(/[/ˈˌ.ː]/g, "");
                    const cleanSpokenIPA = spokenIPA.replace(/[/ˈˌ.ː]/g, "");
                    
                    const ipaDist = getLevenshteinDistance(cleanTargetIPA, cleanSpokenIPA);
                    const maxIpaLen = Math.max(cleanTargetIPA.length, cleanSpokenIPA.length);
                    const ipaSim = (maxIpaLen - ipaDist) / maxIpaLen;

                    currentWordScore = Math.max(textSim, ipaSim);
                }

                if (currentWordScore > bestWordScore) {
                    bestWordScore = currentWordScore;
                    bestMatchIndex = sIdx;
                }
            }

            // Đánh giá từ theo ngưỡng mới
            if (bestMatchIndex !== -1 && bestWordScore >= wordMatchThreshold) {
                spokenPointer = bestMatchIndex + 1;
                const boostedScore = Math.min(1.0, bestWordScore + 0.25); // Thưởng thêm nhiều điểm hơn
                totalScore += boostedScore;
                
                htmlResult += `
                    <div class="word-item" onclick="speakText('${targetWord}')">
                        <span class="word-correct">${targetWord}</span>
                        <span class="ipa-text">/${targetIPA}/</span>
                    </div>`;
            } else {
                htmlResult += `
                    <div class="word-item" onclick="speakText('${targetWord}')">
                        <span class="word-incorrect">${targetWord}</span>
                        <span class="ipa-text">/${targetIPA}/</span>
                    </div>`;
            }
        });

        const finalPercentage = Math.round((totalScore / targetWords.length) * 100);

        scoreBadgeEl.innerText = `Độ chính xác: ${finalPercentage}%`;
        scoreBadgeEl.style.display = "block";
        wordAnalysisEl.innerHTML = htmlResult;

        // Ngưỡng điểm để ĐẠT bài: Càng về câu dài ngưỡng đỗ càng dễ (Chỉ cần >= 35% đến 40%)
        const passThreshold = isLongSentence ? 38 : 50;

        if (finalPercentage >= passThreshold) {
            playSound('success');
            isCurrentPassed = true;
            statusMessageEl.className = "status-message status-success";
            
            if (currentIndex < sentences.length - 1) {
                statusMessageEl.innerText = "🎉 Tuyệt vời! Bấm '❯' để sang câu tiếp theo.";
            } else {
                statusMessageEl.innerText = "🏆 Hoàn thành câu cuối! Bấm '❯' để nhận thưởng!";
            }
        } else {
            playSound('error');
            isCurrentPassed = false;
            statusMessageEl.className = "status-message status-error";
            statusMessageEl.innerText = "👏 Bạn chú ý các từ đỏ nhé, bấm vào từ để nghe lại!";
        }

        updateNavButtons();
    }

    function showRewardScreen() {
        rewardOverlay.classList.add('active');
        playSound('fanfare');
    }

    function restartApp() {
        rewardOverlay.classList.remove('active');
        currentIndex = 0;
        loadSentence();
    }

    window.addEventListener('DOMContentLoaded', () => {
        loadSentence();
    });
</script>
