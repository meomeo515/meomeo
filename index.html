<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Chấm Điểm Phát Âm Tiếng Anh (Accent Mỹ)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .word-box {
            font-size: 28px;
            font-weight: bold;
            color: #007bff;
            margin: 20px 0;
            padding: 15px;
            background-color: #e9ecef;
            border-radius: 8px;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            margin: 5px;
            font-weight: 600;
        }
        button:hover {
            background-color: #218838;
        }
        button:active {
            transform: scale(0.98);
        }
        button:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }
        #btnNext {
            background-color: #007bff;
        }
        #btnNext:hover {
            background-color: #0069d9;
        }
        .result-box {
            margin-top: 25px;
            font-size: 18px;
            text-align: left;
            padding: 15px;
            border-radius: 8px;
            background-color: #f8f9fa;
            border-left: 5px solid #ccc;
        }
        .score {
            font-size: 22px;
            font-weight: bold;
            margin-top: 10px;
        }
        .success { color: #28a745; border-color: #28a745; }
        .warning { color: #ffc107; border-color: #ffc107; }
        .danger { color: #dc3545; border-color: #dc3545; }
    </style>
</head>
<body>

<div class="container">
    <h1>Phát Âm Chuẩn Anh - Mỹ 🇺🇸</h1>
    <p>Hãy bấm nút nghe mẫu hoặc nhấn nói để luyện tập:</p>
    
    <div class="word-box" id="targetWord">Loading...</div>
    
    <button id="btnListen">🔊 Nghe mẫu</button>
    <button id="btnSpeak">🎤 Nhấn để Nói</button>
    <button id="btnNext">Từ tiếp theo ➡️</button>

    <div class="result-box" id="resultCard">
        <div><strong>Bạn đã nói:</strong> <span
